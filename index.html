    setLanguage(biographies.zh?'zh':'ug');
    function showWork(index){current=(index+works.length)%works.length;const base=works[current],w=localizedWork(current);$('lightbox-number').textContent=`${current+1} / ${works.length}`;$('lightbox-img').src=base.image;$('lightbox-img').alt=language==='ug'?w.title:(w.alt||base.alt||w.title);$('lightbox-title').textContent=w.title;$('lightbox-detail').textContent=[base.year,w.medium,base.size,w.description].filter(Boolean).join(' · ');}
    function openWork(index){lastFocus=document.activeElement;showWork(index);lightbox.setAttribute('open','');lightbox.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('close').focus();}
    function closeWork(){lightbox.removeAttribute('open');lightbox.setAttribute('aria-hidden','true');document.body.style.overflow='';lastFocus?.focus();}
    $('close').addEventListener('click',closeWork);$('prev').addEventListener('click',()=>showWork(current-1));$('next').addEventListener('click',()=>showWork(current+1));
    document.addEventListener('keydown',event=>{if(!lightbox.hasAttribute('open'))return;if(event.key==='Escape')closeWork();if(event.key==='ArrowLeft')showWork(current-1);if(event.key==='ArrowRight')showWork(current+1);});
    lightbox.addEventListener('click',event=>{if(event.target===lightbox)closeWork();});
    const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
    if(!reducedMotion.matches&&'IntersectionObserver' in window){
      document.documentElement.classList.add('motion-ready');
      const observer=new IntersectionObserver(entries=>{for(const entry of entries){if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target);}}},{threshold:.12,rootMargin:'0px 0px -20px 0px'});
      document.querySelectorAll('.section-heading,.work-card,.empty,.about:not([hidden])').forEach((node,index)=>{node.style.transitionDelay=`${Math.min(index%3,2)*90}ms`;observer.observe(node);});
    }
    const progress=$('reading-line');let ticking=false;
    function updateProgress(){const total=document.documentElement.scrollHeight-innerHeight;progress.style.transform=`scaleX(${total>0?Math.min(1,scrollY/total):0})`;ticking=false;}
    addEventListener('scroll',()=>{if(!ticking){requestAnimationFrame(updateProgress);ticking=true;}},{passive:true});updateProgress();
    if(matchMedia('(hover:hover) and (pointer:fine)').matches&&!reducedMotion.matches){
      const intro=document.querySelector('.intro');
      intro.addEventListener('pointermove',event=>{const box=intro.getBoundingClientRect();intro.style.setProperty('--light-x',`${((event.clientX-box.left)/box.width*100).toFixed(1)}%`);intro.style.setProperty('--light-y',`${((event.clientY-box.top)/box.height*100).toFixed(1)}%`);});
    }
  </script>
</body>
